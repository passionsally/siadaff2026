<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SIADAFF 관리자 | 출품·후원 관리</title>
    <meta name="robots" content="noindex, nofollow, noarchive">
    <link rel="icon" href="../assets/favicon.png">
    <link rel="stylesheet" href="../assets/admin.css?v=20260526-admin">
  </head>
  <body>
    <main class="admin-shell">
      <header class="admin-header">
        <div>
          <span>SIADAFF 2026 Admin</span>
          <h1>운영사무국 관리 사이트</h1>
          <p>출품 접수와 후원 문의를 각각 별도 탭에서 저장·관리합니다. 이 페이지는 공개 메뉴에 노출되지 않습니다.</p>
        </div>
        <div class="admin-actions">
          <a class="ghost-button" href="/" target="_blank" rel="noreferrer">홈페이지 열기</a>
          <button class="ghost-button" type="button" data-refresh>새로고침</button>
          <button class="danger-button" type="button" data-logout>접근 해제</button>
        </div>
      </header>

      <section class="access-panel" data-access-panel>
        <h2>관리자 접근이 필요합니다.</h2>
        <p>운영진에게 공유된 관리자 링크로 접속해 주세요. 형식은 <strong>/admin/?admin=접근토큰</strong>입니다.</p>
      </section>

      <section class="status-panel" data-status-panel hidden>
        <div>
          <span>출품 접수</span>
          <strong data-submission-count>0</strong>
        </div>
        <div>
          <span>후원 문의</span>
          <strong data-sponsor-count>0</strong>
        </div>
        <div>
          <span>최근 동기화</span>
          <strong data-sync-time>-</strong>
        </div>
      </section>

      <section class="tool-panel" data-tool-panel hidden>
        <div class="tab-list" role="tablist" aria-label="관리 데이터 선택">
          <button class="is-active" type="button" data-tab-button="submissions">출품 접수 관리</button>
          <button type="button" data-tab-button="sponsors">후원 문의 관리</button>
        </div>
        <div class="tool-actions">
          <input type="search" data-search placeholder="이름, 이메일, 기업명, 접수번호 검색">
          <button type="button" data-download-csv>CSV 다운로드</button>
        </div>
      </section>

      <p class="admin-message" data-admin-message hidden></p>

      <section class="data-section is-active" data-tab-panel="submissions" hidden>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>접수일</th>
                <th>접수번호</th>
                <th>부문</th>
                <th>작품명</th>
                <th>연령/형태</th>
                <th>신청자</th>
                <th>연락처</th>
                <th>저장 관리</th>
              </tr>
            </thead>
            <tbody data-submission-rows></tbody>
          </table>
        </div>
      </section>

      <section class="data-section" data-tab-panel="sponsors" hidden>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>문의일</th>
                <th>문의번호</th>
                <th>기업·기관</th>
                <th>담당자</th>
                <th>후원 유형</th>
                <th>예산</th>
                <th>연락처</th>
                <th>저장 관리</th>
              </tr>
            </thead>
            <tbody data-sponsor-rows></tbody>
          </table>
        </div>
      </section>
    </main>

    <script src="../assets/config.js?v=20260526-admin"></script>
    <script src="../assets/admin.js?v=20260526-admin"></script>
  </body>
</html>
